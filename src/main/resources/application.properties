spring.application.name=core-service
spring.config.import=optional:file:core/.env[.properties]

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

kma.service-key=${KMA_API_KEY}
kma.url=https://apihub.kma.go.kr/api/typ02/openApi/VilageFcstInfoService_2.0
kma.location-coordinate-file=classpath:동네예보지점좌표(위경도)_260701.xlsx

server.port=8765

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/,http://localhost:8762/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true